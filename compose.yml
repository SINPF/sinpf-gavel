services:

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO object storage ─────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - internal

  # ── Gavel web app ────────────────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV:            production
      DATABASE_URL:        postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      BETTER_AUTH_SECRET:  ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL:     ${BETTER_AUTH_URL}
# Internal MinIO connection (server-side SDK)
      MINIO_ENDPOINT:      minio
      MINIO_PORT:          "9000"
      MINIO_ACCESS_KEY:    ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY:    ${MINIO_SECRET_KEY}
      MINIO_BUCKET:        ${MINIO_BUCKET}
      MINIO_USE_SSL:       "false"
      # Public URL for pre-signed download links served through the proxy.
      # Set to http(s)://your-server/storage in production.
      MINIO_PUBLIC_URL:    ${MINIO_PUBLIC_URL}
      MICROSOFT_CLIENT_ID:     ${MICROSOFT_CLIENT_ID}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET}
      MICROSOFT_TENANT_ID:     ${MICROSOFT_TENANT_ID}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - internal

  # ── DB migrations (on-demand, `--profile migrate`) ──────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    profiles: ["migrate"]
    command: ["bun", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgres://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ── Wipe users + cases (on-demand, `--profile wipe`) ────────────────────────
  # Truncates auth + case data. Preserves employers.
  # Usage: docker compose --profile wipe run --rm wipe
  wipe:
    image: postgres:17-alpine
    profiles: ["wipe"]
    environment:
      PGHOST:     db
      PGUSER:     ${DB_USER}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_NAME}
    entrypoint: ["psql", "-v", "ON_ERROR_STOP=1"]
    command:
      - "-c"
      - |
        TRUNCATE TABLE
          case_payments,
          case_closure,
          case_proceedings,
          case_activities,
          case_attachments,
          case_referral_types,
          case_referrals,
          session,
          account,
          verification,
          "user"
        RESTART IDENTITY CASCADE;
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  # ── Caddy reverse proxy ──────────────────────────────────────────────────────
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  caddy_data:
  caddy_config:
